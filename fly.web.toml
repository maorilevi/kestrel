# KESTREL web app on Fly.io. See DEPLOY.md.
app = "kestrel-web"
primary_region = "fra"

[build]
  dockerfile = "deploy/web.Dockerfile"

  [build.args]
    KESTREL_SERVER_URL = "https://kestrel-server.fly.dev"
    NEXT_PUBLIC_KESTREL_WS_URL = "wss://kestrel-server.fly.dev"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/login"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
